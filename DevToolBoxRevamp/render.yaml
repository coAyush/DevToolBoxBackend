databases:
  - name: devtoolbox-postgres
    databaseName: devtoolbox
    user: devtoolbox_user # FIXED: 'postgres' is a reserved username on Render
    postgresMajorVersion: "17"
    plan: free

services:
  # 1. Redis Service
  - type: keyvalue
    name: devtoolbox-redis
    plan: free
    ipAllowList: []

  # 2. Spring Boot Docker Service
  - type: web
    name: devtoolbox-app
    runtime: docker
    plan: free
    rootDir: DevToolBoxRevamp # Tells Render to look inside this folder for your Dockerfile
    envVars:
      - key: PORT
        value: 8080
      # FIXED: Extract valid properties (host, port, database) to build the JDBC URL
      - key: DB_HOST
        fromDatabase:
          name: devtoolbox-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: devtoolbox-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: devtoolbox-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: devtoolbox-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: devtoolbox-postgres
          property: password
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: devtoolbox-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: devtoolbox-redis
          property: port